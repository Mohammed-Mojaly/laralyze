name: tests

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# A newer push makes the older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        # The lowest versions are the first without known security issues.
        laravel: ['^12.69.2', '^13.32']
        livewire: ['^3.8.3', '^4.3.4']
        stability: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Livewire ${{ matrix.livewire }} / ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "livewire/livewire:${{ matrix.livewire }}" --no-update --no-interaction
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --with-all-dependencies

      - name: Installed versions
        run: composer show | grep -E '^(laravel/framework|livewire/livewire|orchestra/testbench|pestphp/pest) '

      - name: Tests
        run: vendor/bin/pest

  databases:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: mysql
            image: mysql:8.4
            port: 3306
            options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=20
          - driver: mysql
            image: mysql:9
            port: 3306
            options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=20
          - driver: mariadb
            image: mariadb:11
            port: 3306
            options: --health-cmd="healthcheck.sh --connect" --health-interval=5s --health-timeout=5s --health-retries=20
          - driver: pgsql
            image: postgres:16
            port: 5432
            options: --health-cmd=pg_isready --health-interval=5s --health-timeout=5s --health-retries=20
          - driver: pgsql
            image: postgres:17
            port: 5432
            options: --health-cmd=pg_isready --health-interval=5s --health-timeout=5s --health-retries=20
          - driver: sqlsrv
            image: mcr.microsoft.com/mssql/server:2022-latest
            port: 1433
            options: ''

    name: Storage and dashboard on ${{ matrix.image }}

    # One container per run; each image reads only its own variables.
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: laralyze_test
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: yes
          MARIADB_DATABASE: laralyze_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: laralyze_test
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Laralyze!Passw0rd
        ports: ['${{ matrix.port }}:${{ matrix.port }}']
        options: ${{ matrix.options }}

    env:
      LARALYZE_TEST_DB: ${{ matrix.driver }}
      DB_PORT: ${{ matrix.port }}
      DB_PASSWORD: ${{ matrix.driver == 'pgsql' && 'postgres' || (matrix.driver == 'sqlsrv' && 'Laralyze!Passw0rd' || '') }}

    steps:
      - uses: actions/checkout@v5

      # pdo_sqlsrv needs Microsoft's ODBC driver, which the runner doesn't ship.
      - name: Install the SQL Server ODBC driver
        if: matrix.driver == 'sqlsrv'
        run: |
          if ! grep -rqs "packages.microsoft.com/ubuntu" /etc/apt/sources.list /etc/apt/sources.list.d/; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          fi
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlsrv
          coverage: none

      - run: composer update --prefer-dist --no-interaction

      # The SQL Server image has no health check, and starts with no database.
      - name: Create the SQL Server database
        if: matrix.driver == 'sqlsrv'
        run: |
          for i in $(seq 1 60); do
            php -r 'new PDO("sqlsrv:Server=127.0.0.1,1433;TrustServerCertificate=1", "sa", getenv("DB_PASSWORD"));' 2>/dev/null && break
            sleep 2
          done
          php -r '(new PDO("sqlsrv:Server=127.0.0.1,1433;TrustServerCertificate=1", "sa", getenv("DB_PASSWORD")))->exec("CREATE DATABASE laralyze_test");'

      - name: Tests
        run: vendor/bin/pest --group=storage --group=dashboard

  install:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']

    name: Fresh install on Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v5
        with:
          path: package

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Create a Laravel app
        run: composer create-project "laravel/laravel:^${{ matrix.laravel }}.0" app --prefer-dist --no-interaction

      # The same two commands the README gives.
      - name: Install Laralyze
        working-directory: app
        run: |
          composer config repositories.laralyze path ../package
          composer require "mohammed-mojaly/laralyze:@dev" --no-interaction
          php artisan laralyze:install --no-interaction

      - name: Record requests and open the dashboard
        working-directory: app
        run: |
          php artisan serve --port=8000 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/up > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/ > /dev/null
          curl -sf http://127.0.0.1:8000/laralyze | grep -q '<title>Dashboard · Laralyze</title>'
          curl -sf http://127.0.0.1:8000/laralyze/requests > /dev/null
          sleep 2
          rows=$(php -r '$db = new PDO("sqlite:database/database.sqlite"); echo $db->query("select count(*) from laralyze_aggregates where type = \x27request\x27")->fetchColumn();')
          echo "Request rows: $rows"
          test "$rows" -gt 0

      - name: Laravel log
        if: failure()
        working-directory: app
        run: cat storage/logs/laravel.log serve.log 2>/dev/null || true

  quality:
    runs-on: ubuntu-latest

    name: Static analysis, style and performance budget

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          ini-values: opcache.enable_cli=1
          coverage: none

      - run: composer update --prefer-dist --no-interaction

      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - run: vendor/bin/pint --test

      - run: php benchmarks/run.php --compare
